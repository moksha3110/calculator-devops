<!DOCTYPE html>
<html>
<head>
    <title>Calculator APP</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="container">

<h1 style="color:red;">🚀 Calculator App - Version 3 🚀</h1>

<p style="color:green;font-size:22px;font-weight:bold;">
This page was deployed automatically using GitHub Actions + Docker + Amazon ECR + ECS + Terraform.
</p>

<form method="POST">

<input type="number" step="any" name="num1" required>

<select name="operation">
<option value="+">+</option>
<option value="-">-</option>
<option value="*">*</option>
<option value="/">/</option>
</select>

<input type="number" step="any" name="num2" required>

<br><br>

<button type="submit">Calculate</button>

</form>

{% if result != "" %}

<h2>Result : {{ result }}</h2>

{% endif %}

</div>

</body>
</html>
